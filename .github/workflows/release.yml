name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build to GitHub Releases
        type: boolean
        default: false

# electron-builder 需要创建 / 更新 Release 与上传安装包
permissions:
  contents: write

# 标签一旦推上去就不要再动它：删除、强推、移到别的提交都算「标签被删」。
# GitHub 不会删掉对应的 Release，而是把它降级成草稿 —— 草稿对未认证请求不可见，
# 且 /releases/download/<标签>/<文件> 恒 404，客户端查不到这个更新；带令牌的 CI 请求
# 却能正常往里传资产，于是表现为「打包全绿、只有最后的下载校验失败」。
# 1.0.11 实测：12:54 删标签重推、13:14 强推移标签，两次都把 430569726 打成草稿。
# 下面的 Prepare 步骤会自动取消草稿；重发同一版本用 workflow_dispatch 勾 publish，
# 或在 Actions 里 Re-run 失败作业 —— 都不要再动标签。

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron 与 NSIS 等构建工具体积大，命中缓存能省下几分钟
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Check i18n dictionaries
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 标签版本必须与 package.json 一致：latest.yml 与安装包名都以它为准，
      # 不一致会让客户端查到永远装不上的"新版本"
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # 发版说明只有一个来源：附注标签的正文（git tag -a 写的那段）。
      # electron-builder 从两个位置各读一次，所以同一份文案要落两个文件：
      # - 项目根 release-notes.md → GitHub Release 正文（PublishManager 固定读根目录）
      # - build/release-notes.md → latest.yml 的 releaseNotes（默认资源名只在 buildResources 目录里找）
      # 客户端「检查更新」面板显示的是后者，不写就会一直是空白。
      # 取不到附注时只警告、不中断：安装包发布比正文完整度重要。
      - name: Collect release notes from tag annotation
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 标签推送用当前标签；手动补发同一版本时用 package.json 推出来的 v<版本>，
          # 这样 workflow_dispatch 这条路也带得上发版说明，不会发出空正文的 Release
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          sha=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          notes=""
          if [ -n "$sha" ]; then
            # 附注标签的正文在 tag 对象里；轻量标签会走这里失败，下面按空处理
            notes=$(gh api "repos/$REPO/git/tags/$sha" --jq .message 2>/dev/null || true)
          fi
          if [ -z "$notes" ]; then
            echo "::warning::无法从标签 $tag 读取附注正文，Release 正文与客户端更新说明将为空"
            exit 0
          fi
          # 正文首行通常就是标签名本身，Release 页面已有标题，去掉它
          if [ "$(printf '%s\n' "$notes" | head -n 1)" = "$tag" ]; then
            notes=$(printf '%s\n' "$notes" | tail -n +2)
          fi
          # 标签正文第二行往往是空行；客户端更新面板按纯文本显示，开头留白会显得错位。
          # 这里用 awk 而不是 sed '/./,$!d'：Windows runner 的 git-bash 会把以 / 开头的
          # 参数当路径改写，sed 表达式会因此损坏。
          notes=$(printf '%s\n' "$notes" | awk '{ if (NF > 0) p = 1; if (p) print }')
          printf '%s\n' "$notes" > release-notes.md
          cp release-notes.md build/release-notes.md
          echo "发版说明 $(wc -l < release-notes.md) 行，取自标签附注（根目录 + build/ 各一份）"

      # electron-builder 给每个待上传文件（安装包 / blockmap / latest.yml）各建一个 publisher，
      # 每个 publisher 独立执行「查 Release，没有就建」—— 并发下会各建一份，同一个标签因此挂两个
      # Release。而 GitHub 的 /releases/download/<标签>/<文件> 只会解析到其中一个，落在另一份里的
      # latest.yml 与安装包直接 404，客户端「检查更新」就废了（1.0.10、1.0.11 首推正是这样：
      # latest.yml 与 exe 都是 404，只有 blockmap 能下）。
      # 这里保留资产最全的那份、删掉其余，一份都没有时才新建；electron-builder 只负责往留下的
      # 那份里补齐资产。日志只有仓库管理员能看，所以每一步都把结论写成注解（::notice:: / ::error::），
      # 出问题时用 check-runs/{job}/annotations 就能看到细节。
      - name: Prepare a single release for the tag
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name==\"$tag\")] | .[].id")
          if [ -z "$ids" ]; then
            # 查询失败与「确实没有」都返回空，用总数区分一下
            total=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "length" 2>&1)
            if [[ "$total" =~ ^[0-9]+$ ]]; then
              echo "::notice::标签 $tag 还没有 Release"
            else
              echo "::error::查询 Release 列表失败：$(echo "$total" | tr '\n' ' ')"
              exit 1
            fi
          else
            echo "::notice::标签 $tag 现有 Release：$(echo "$ids" | tr '\n' ' ')（保留资产最全的一份）"
            keep=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name==\"$tag\")] | max_by(.assets | length) | .id")
            # GitHub 删标签并不会删掉 Release，而是把它降级成草稿：草稿对未认证请求不可见，
            # 且 /releases/download/<标签>/<文件> 恒 404，客户端就查不到这个更新。
            # 只有带令牌的请求（就是这里）看得到它，所以传资产全部成功、校验却一直失败。
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$keep" --jq .draft)" = "true" ]; then
              echo "::notice::Release $keep 是草稿态（删标签留下的），先取消草稿再传资产"
              if ! out=$(gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false 2>&1); then
                echo "::error::取消 Release $keep 的草稿态失败：$(echo "$out" | tr '\n' ' ')"
                exit 1
              fi
            fi
            for id in $ids; do
              if [ "$id" = "$keep" ]; then
                count=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq ".assets | length")
                echo "::notice::保留 Release $id，已有 $count 个资产，缺的由 electron-builder 补"
                continue
              fi
              if ! out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" 2>&1); then
                echo "::error::删除 Release $id 失败：$(echo "$out" | tr '\n' ' ')"
                exit 1
              fi
              echo "已删除 Release $id"
            done
          fi

          rest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name==\"$tag\")] | length")
          if [ -z "$rest" ]; then
            echo "::error::查询标签 $tag 的 Release 数量失败"
            exit 1
          fi
          if [ "$rest" = "0" ]; then
            notes_args=(--notes "构建提交 $GITHUB_SHA")
            [ -f release-notes.md ] && notes_args=(--notes-file release-notes.md)
            if ! out=$(gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$version" "${notes_args[@]}" 2>&1); then
              echo "::error::创建 Release $tag 失败：$(echo "$out" | tr '\n' ' ')"
              exit 1
            fi
            echo "::notice::已新建 Release $tag"
          fi

      - name: Build and publish
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 预建的 Release 就算放超过两小时也要复用；否则 electron-builder 会拒绝追加资产，
          # 重跑作业时会漏传文件
          EP_GH_IGNORE_TIME: true
        run: npm run dist:win:publish

      # 手动触发默认只打包验证，不碰 Release
      - name: Build installer (manual, no publish)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npm run dist:win

      # 上面那个 404 只有真发一次才测得出来，所以发布后立刻按客户端实际用的下载链接验一遍
      - name: Verify the release is downloadable
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          exe="Keyper-$version-win-x64.exe"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # 资产刚传完时 GitHub 的下载路由可能还没同步完，先重试再判失败
          probe() {
            for attempt in 1 2 3 4 5; do
              code=$(curl -sIL -o /dev/null -m 60 -w "%{http_code}" "$1")
              if [ "$code" = "200" ]; then
                echo "$2 -> 200"
                return 0
              fi
              echo "$2 -> $code（第 $attempt 次）"
              sleep 20
            done
            echo "::error::标签 $TAG 的 $2 下载不到，客户端查不到这个更新"
            return 1
          }
          for f in "latest.yml" "$exe" "$exe.blockmap"; do
            # 用 HEAD 探状态，别把 81MB 的安装包再下一遍；GitHub 会 302 到对象存储，必须跟跳转
            probe "$base/$f" "$f" || exit 1
          done
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[] | .[] | select(.tag_name==\"$TAG\") | .id" | wc -l)
          if [ "$count" != "1" ]; then
            echo "::error::标签 $TAG 挂着 $count 个 Release，下载路径只会解析到其中一个"
            exit 1
          fi
          # 最终状态也写成注解，以后排查不用去要管理员才看得到的日志
          echo "::notice::$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.tag_name): id=\(.id) 资产=\([.assets[].name] | join(", "))"')"
          if ! curl -sSL "$base/latest.yml" | grep -q "^releaseNotes"; then
            echo "::warning::latest.yml 里没有 releaseNotes，客户端「检查更新」面板会是空的"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyper-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.yml
          if-no-files-found: error
