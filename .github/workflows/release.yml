name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build to GitHub Releases
        type: boolean
        default: false

# electron-builder 需要创建 / 更新 Release 与上传安装包
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron 与 NSIS 等构建工具体积大，命中缓存能省下几分钟
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Check i18n dictionaries
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 标签版本必须与 package.json 一致：latest.yml 与安装包名都以它为准，
      # 不一致会让客户端查到永远装不上的"新版本"
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build and publish (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win:publish

      # 手动触发默认只打包验证；勾选 publish 才会上传 Release
      - name: Build installer (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npm run dist:win

      - name: Build and publish (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win:publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyper-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.yml
          if-no-files-found: error
