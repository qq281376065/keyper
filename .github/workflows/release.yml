name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build to GitHub Releases
        type: boolean
        default: false

# electron-builder 需要创建 / 更新 Release 与上传安装包
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron 与 NSIS 等构建工具体积大，命中缓存能省下几分钟
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Check i18n dictionaries
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 标签版本必须与 package.json 一致：latest.yml 与安装包名都以它为准，
      # 不一致会让客户端查到永远装不上的"新版本"
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # 发版说明只有一个来源：附注标签的正文（git tag -a 写的那段）。
      # electron-builder 从两个位置各读一次，所以同一份文案要落两个文件：
      # - 项目根 release-notes.md → GitHub Release 正文（PublishManager 固定读根目录）
      # - build/release-notes.md → latest.yml 的 releaseNotes（默认资源名只在 buildResources 目录里找）
      # 客户端「检查更新」面板显示的是后者，不写就会一直是空白。
      # 取不到附注时只警告、不中断：安装包发布比正文完整度重要。
      - name: Collect release notes from tag annotation
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          notes=""
          if [ -n "$sha" ]; then
            # 附注标签的正文在 tag 对象里；轻量标签会走这里失败，下面按空处理
            notes=$(gh api "repos/$REPO/git/tags/$sha" --jq .message 2>/dev/null || true)
          fi
          if [ -z "$notes" ]; then
            echo "::warning::无法从标签 $TAG 读取附注正文，Release 正文与客户端更新说明将为空"
            exit 0
          fi
          # 正文首行通常就是标签名本身，Release 页面已有标题，去掉它
          if [ "$(printf '%s\n' "$notes" | head -n 1)" = "$TAG" ]; then
            notes=$(printf '%s\n' "$notes" | tail -n +2)
          fi
          # 标签正文第二行往往是空行；客户端更新面板按纯文本显示，开头留白会显得错位。
          # 这里用 awk 而不是 sed '/./,$!d'：Windows runner 的 git-bash 会把以 / 开头的
          # 参数当路径改写，sed 表达式会因此损坏。
          notes=$(printf '%s\n' "$notes" | awk '{ if (NF > 0) p = 1; if (p) print }')
          printf '%s\n' "$notes" > release-notes.md
          cp release-notes.md build/release-notes.md
          echo "发版说明 $(wc -l < release-notes.md) 行，取自标签附注（根目录 + build/ 各一份）"

      # electron-builder 给每个待上传文件（安装包 / blockmap / latest.yml）各建一个 publisher，
      # 每个 publisher 独立执行「查 Release，没有就建」—— 并发下会各建一份，同一个标签因此挂两个
      # Release。而 GitHub 的 /releases/download/<标签>/<文件> 只会解析到 id 更小的那一个，
      # 落在另一份里的 latest.yml 与安装包直接 404，客户端「检查更新」就废了
      # （1.0.10、1.0.11 首推正是这样：latest.yml 与 exe 都是 404，只有 blockmap 能下）。
      # 所以先把该标签下的 Release 清干净、只建一份，publisher 之后只会往同一份里追加资产。
      - name: Prepare a single release for the tag
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[] | .[] | select(.tag_name==\"$tag\") | .id"); do
            echo "删除同标签的旧 Release $id（连同其资产）"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          if [ -f release-notes.md ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$version" --notes-file release-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$version" --notes "构建提交 $GITHUB_SHA"
          fi

      - name: Build and publish
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 预建的 Release 就算放超过两小时也要复用；否则 electron-builder 会拒绝追加资产，
          # 重跑作业时会漏传文件
          EP_GH_IGNORE_TIME: true
        run: npm run dist:win:publish

      # 手动触发默认只打包验证，不碰 Release
      - name: Build installer (manual, no publish)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npm run dist:win

      # 上面那个 404 只有真发一次才测得出来，所以发布后立刻按客户端实际用的下载链接验一遍
      - name: Verify the release is downloadable
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          exe="Keyper-$version-win-x64.exe"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for f in "latest.yml" "$exe" "$exe.blockmap"; do
            # GitHub 会 302 到对象存储，必须跟跳转；只看首个响应的状态码会误判
            code=$(curl -sSL -o /dev/null -w "%{http_code}" "$base/$f")
            echo "$f -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::标签 $TAG 的 $f 下载不到，客户端查不到这个更新"
              exit 1
            fi
          done
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[] | .[] | select(.tag_name==\"$TAG\") | .id" | wc -l)
          if [ "$count" != "1" ]; then
            echo "::error::标签 $TAG 挂着 $count 个 Release，下载路径只会解析到其中一个"
            exit 1
          fi
          if ! curl -sSL "$base/latest.yml" | grep -q "^releaseNotes"; then
            echo "::warning::latest.yml 里没有 releaseNotes，客户端「检查更新」面板会是空的"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyper-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.yml
          if-no-files-found: error
