name: Release Mac (manual)

# 独立 Mac 发布工作流：只构建 macOS DMG 并上传到已存在的 Release。
# 与 release.yml（Windows job，tag 推送触发）完全隔离，避免重跑时重复上传 Windows 包。
# 触发方式：GitHub 页面 Actions → Release Mac (manual) → Run workflow，
#           或通过 GitHub API workflow_dispatch（ref 必须为 main）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target release tag, e.g. v1.1.10'
        required: true
        default: 'v1.1.10'

permissions:
  contents: write

concurrency:
  group: release-mac-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      # 仓库内 icon.png 仅 256x256，macOS 需要标准 iconset。
      # 用系统自带 sips/iconutil 放大并生成 build/icon.icns（仅 CI 内生成，不提交仓库）。
      - name: Generate macOS icon (.icns)
        run: |
          set -e
          mkdir -p build/icon.iconset
          sips -z 16 16     build/icon.png --out build/icon.iconset/icon_16x16.png      >/dev/null
          sips -z 32 32     build/icon.png --out build/icon.iconset/icon_16x16@2x.png   >/dev/null
          sips -z 32 32     build/icon.png --out build/icon.iconset/icon_32x32.png      >/dev/null
          sips -z 64 64     build/icon.png --out build/icon.iconset/icon_32x32@2x.png   >/dev/null
          sips -z 128 128   build/icon.png --out build/icon.iconset/icon_128x128.png    >/dev/null
          sips -z 256 256   build/icon.png --out build/icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   build/icon.png --out build/icon.iconset/icon_256x256.png    >/dev/null
          sips -z 512 512   build/icon.png --out build/icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   build/icon.png --out build/icon.iconset/icon_512x512.png    >/dev/null
          sips -z 1024 1024 build/icon.png --out build/icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build/icon.iconset -o build/icon.icns
          ls -lh build/icon.icns

      # electron-builder 读取 electron-builder.yml 中 mac.target(dmg, x64+arm64)。
      # --publish never 避免自动创建/改动 Release，上传交给下一步 gh release upload 精确控制。
      - name: Build macOS DMG (x64 + arm64)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          dmg_dir="release/${version#v}"
          echo "DMG 目录: $dmg_dir"
          ls -lh "$dmg_dir"/*.dmg
          for f in "$dmg_dir"/*.dmg; do
            echo "上传: $(basename "$f")"
            gh release upload "$version" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done
          echo "=== Release 现有资产 ==="
          gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyper-macos-${{ inputs.version }}
          path: release/**/*.dmg
          if-no-files-found: error
