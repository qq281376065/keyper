name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# 同一分支的新提交取消上一轮，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check i18n dictionaries
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 与 npm run build 相同的产物（含主进程 / preload），
      # typecheck 已单独执行，这里不再重复。
      #
      # ⚠️ 必须用 vite build 而不是 npm run build：
      # 后者含 typecheck（上面已跑过），但**不能**跳过 csp-hash 这一步 ——
      # dist/index.html 的 meta CSP 依赖它对内联脚本算 sha256。
      # 漏掉后发布包里的首屏主题脚本会被 CSP 拦下（亮暗闪烁）。
      - name: Build bundles
        run: npx vite build

      - name: Inject CSP hashes
        run: node scripts/csp-hash.mjs

      # 兜底：确认注入结果与内联脚本一致（防止脚本自身写错）
      - name: Verify CSP hashes
        run: npm run csp:check

      # 样式规范守护：--lift-shadow 几何 / 9 套皮肤 alpha / 胶囊白名单 /
      # 选中态 inset+外影 / Tailwind 层外覆盖。零依赖，只读源码不启动浏览器。
      # 另有两个 CDP 探针（check-lift-shadow / check-tab-lift）不进 CI：
      # 它们硬编码本机 Chrome 路径且依赖 design/ 预览页，只作本地手工验证。
      - name: Check style conventions
        run: npm run style:check

      # 最小 e2e：脚本自包含启动 vite --mode web 与无头 Chrome，
      # 用 CDP 读 DOM / 计算样式 / 控制台，6 条冒烟，不截图。
      # ubuntu-latest 自带 Google Chrome，用 CHROME_PATH 指过去。
      - name: E2E smoke (CDP, no screenshots)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
