name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# 同一分支的新提交取消上一轮，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check i18n dictionaries
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 与 npm run build 相同的产物（含主进程 / preload），
      # typecheck 已单独执行，这里不再重复
      - name: Build bundles
        run: npx vite build
