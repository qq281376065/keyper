appId: com.keyper.app
productName: Keyper
copyright: Copyright © 2026 Keyper

directories:
  output: release/${version}
  buildResources: build

# 打进安装包的内容
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'

extraMetadata:
  main: dist-electron/main.js

asar: true
compression: normal
npmRebuild: false

# 只保留界面真正用到的 Chromium 语言包。
# Electron 默认塞进 50+ 种 locale（解包后约 41MB），是安装包里最大的一块
# 可裁剪体积；三种语言之外的界面文案本来也不会被用户看到。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW

# 自动更新源：GitHub Releases。
# electron-builder 会生成 latest.yml 与 *.blockmap —— 后者是增量更新的基础，
# electron-updater 下载时只取与本地版本不同的分块（differential download）。
publish:
  provider: github
  owner: qq281376065
  repo: keyper
  # 打完包直接公开 Release，客户端才能立刻查到；需要人工补发版说明时
  # 可在 CI 里把这里改成 draft，并在发布后手动点「Publish release」。
  releaseType: release

# 国内网络建议走镜像，避免 Electron 二进制下载超时
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - target: nsis
      arch:
        - x64
  # 应用图标：build/icon.ico 内含 16/24/32/48/64/128/256 七个尺寸
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  # 安装位置与快捷方式由 build/installer.nsh 的「准备」页接管：
  # 关闭内置目录页，避免出现两套选目录界面；桌面/开始菜单快捷方式
  # 也关闭默认创建，统一按用户在准备页的勾选创建与清理。
  allowToChangeInstallationDirectory: false
  # 增量更新：保留 blockmap，electron-updater 只下载变化的二进制分块
  differentialPackage: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: Keyper
  deleteAppDataOnUninstall: false
  # 安装器自身在「程序和功能」里显示的图标
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 助手型安装器顶部品牌头图（150×57 BMP，MUI 头部右侧）
  installerHeader: build/installerHeader.bmp
  # 自定义安装逻辑：环境检查页 + 写入用户 PATH
  include: build/installer.nsh
  # 中文界面（默认跟随系统语言，显式列出保证中文用户看到的都是中文）
  installerLanguages:
    - zh_CN
    - en_US

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Keyper
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
