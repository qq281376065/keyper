<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyper</title>
    <script>
      /*
       * 在首帧渲染前确定主题，避免亮暗切换闪烁。
       * 皮肤即主题：皮肤值时 data-theme 直接取皮肤 id，
       * 明暗档写 data-scheme（CSS [data-scheme] 驱动 color-scheme），
       * 与 theme.ts 的 SKIN_SCHEME 保持一致。
       * 不写 style.colorScheme：生产 CSP style-src 'self' 会拦内联样式。
       */
      (function () {
        var SCHEME = {
          ocean: 'dark',
          solarized: 'light',
          phosphor: 'dark',
          sakura: 'light',
          mint: 'light',
          mist: 'light',
          berry: 'light',
        }
        /* 已下线皮肤的就近迁移，与 theme.ts 的 RETIRED_SKINS 保持一致 */
        var RETIRED = { forest: 'phosphor', aurora: 'light' }
        try {
          // 先读新 key；老用户的历史偏好在旧 key 里，回退读一次
          var stored = localStorage.getItem('keyper:theme')
                    || localStorage.getItem('redisdocter:theme')
                    || 'system'
          if (RETIRED[stored]) stored = RETIRED[stored]
          if (SCHEME[stored]) {
            document.documentElement.dataset.theme = stored
            document.documentElement.dataset.scheme = SCHEME[stored]
            return
          }
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.scheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
